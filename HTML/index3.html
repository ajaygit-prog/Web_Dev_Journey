<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <caption><h1>Registration Form</h1></caption>
    </header>

    <main>
        <form action="POST">
            <lebel for="name">Name : </lebel>
            <input type="text" name="User Name" id="name" placeholder="User Name">
            <br><br>
            <lebel for="email">Email : </lebel>
            <input type="email" name="email" id="email" placeholder="email">
            <br><br>
            <lebel for="password">password : </lebel>
            <input type="password" name="password" id="password" placeholder="password">
            <br><br>
            <lebel for="phone">Phone Number :</lebel>
            <input type="text" name="Phone" id="phone" placeholder="Phone number">
            <br><br>
            <p>Select gender</p>
            <input type="radio" name="gender" id="gen">
            <lebel for="gen">Male</lebel>
            <input type="radio" name="gender" id="fem">
            <lebel for="fem">Female</lebel>
            <br><br>
            <p>Select Subject</p>
            <input type="checkbox" name="maths" id="mat">
            <lebel for="mat">Maths</lebel>
            <input type="checkbox" name="english" id="eng">
            <lebel for="mat">English</lebel>

            <br><br>

            <select>
                <option value="Basti">Basti</option>
                <option value="Gorakhpur">Gorakhpur</option>
                <option value="Mahrajgang">Maharajgang</option>
                <option value="Deoria">Devoria</option>
                <option value="Varansi">Varansi</option>
            </select>


            <br><br>
            <input type="textarea" placeholder="feedback" >
            
            
            

            
            
            <br><br>
            <input type="submit">
        </form>
        <br><br>

        <footer>if you will submit this form then only your registration will be completed</footer>

    </main>
    
</body>
</html>
